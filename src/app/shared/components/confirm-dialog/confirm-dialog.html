<h2 mat-dialog-title>{{ 'Confirm' }}</h2>

<mat-dialog-content>
  {{ 'Are you sure?' }}
</mat-dialog-content>

<mat-dialog-actions>
  <button matButton class="btn-submit" [mat-dialog-close]="true">Delete</button>

  <button matButton class="btn-cancel" (click)="onClose()">
    Cancel
  </button>
</mat-dialog-actions>
