<div class="search-page">
  @if (paginatedBooks(); as books) {

  @if (books.length > 0) {

  <h2>Books found for your search: {{ initialListOfBooks().length }}</h2>
  <div class="wrapper-content">

    @for (book of books; track book.id) {
    <app-product-card [book]="book"></app-product-card>
    }

  </div>

  }@else {
  <h2>No books found for your search.</h2>
  }
  }

</div>

<mat-paginator [length]="initialListOfBooks().length" [pageSize]="pageSize()" [pageIndex]="pageIndex()"
  [pageSizeOptions]="pageSizeOptions" [showFirstLastButtons]="true" (page)="handlePageEvent($event)"
  aria-label="Select page">
</mat-paginator>
